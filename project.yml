name: Gatekeeper
options:
  bundleIdPrefix: com.noah
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_VERSION: "5.0"
    GATEKEEPER_API_ORIGIN: "https://api.rooklayer.com"
    GATEKEEPER_PRIVACY_URL: "https://api.rooklayer.com/privacy"
    GATEKEEPER_SUPPORT_URL: "https://api.rooklayer.com/support"
    GATEKEEPER_TERMS_URL: ""
  configs:
    Debug:
      APS_ENVIRONMENT: development
    Release:
      APS_ENVIRONMENT: production
targets:
  Gatekeeper:
    type: application
    platform: iOS
    sources: [App, Shared, Sources/GatePolicy]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noah.gatekeeper
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/Gatekeeper.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Rook
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Rook
        UILaunchScreen: {}
        GATEKEEPER_API_ORIGIN: $(GATEKEEPER_API_ORIGIN)
        GATEKEEPER_PRIVACY_URL: $(GATEKEEPER_PRIVACY_URL)
        GATEKEEPER_SUPPORT_URL: $(GATEKEEPER_SUPPORT_URL)
        GATEKEEPER_TERMS_URL: $(GATEKEEPER_TERMS_URL)
        UIBackgroundModes: [remote-notification]
        CFBundleURLTypes:
          - CFBundleURLName: com.noah.gatekeeper.sync
            CFBundleURLSchemes: [gatekeeper]
    dependencies:
      - target: GatekeeperMonitor
        embed: true
  GatekeeperHostedTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/HostedAppTests]
    dependencies:
      - target: Gatekeeper
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.noah.gatekeeper.hosted-tests
  GatekeeperMonitor:
    type: app-extension
    platform: iOS
    sources: [Monitor, Shared, Sources/GatePolicy]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noah.gatekeeper.monitor
        CODE_SIGN_ENTITLEMENTS: Monitor/Monitor.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Monitor/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ActivityMonitor
schemes:
  Gatekeeper:
    build:
      targets:
        Gatekeeper: all
    test:
      targets:
        - GatekeeperHostedTests
